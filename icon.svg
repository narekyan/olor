<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2540"/>
      <stop offset="1" stop-color="#0b0e15"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- tiles, generous padding so the icon survives a maskable circle crop -->
  <g fill="#232b3d">
    <rect x="136" y="136" width="72" height="72" rx="18"/>
    <rect x="220" y="136" width="72" height="72" rx="18"/>
    <rect x="304" y="136" width="72" height="72" rx="18"/>
    <rect x="136" y="220" width="72" height="72" rx="18"/>
    <rect x="304" y="220" width="72" height="72" rx="18"/>
    <rect x="136" y="304" width="72" height="72" rx="18"/>
    <rect x="220" y="304" width="72" height="72" rx="18"/>
    <rect x="304" y="304" width="72" height="72" rx="18"/>
  </g>
  <!-- the winding path, split in two so each half carries its own gradient -->
  <polyline points="172,256 172,340 340,340"
            fill="none" stroke="url(#g2)" stroke-width="42"
            stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="172,172 340,172 340,256 172,256"
            fill="none" stroke="url(#g)" stroke-width="42"
            stroke-linecap="round" stroke-linejoin="round"/>
</svg>
